<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buenas noches, Luz</title>
    <link rel="icon" href="assets/img/flowers.png" type="image/x-icon" />

    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Infant:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Karla:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="assets/css/back-button.css" />
    <link rel="stylesheet" href="assets/css/transicion.css" />
    <link rel="stylesheet" href="assets/css/buenas-noches.css" />
  </head>

  <body>
    <button class="back-button" onclick="goBack()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <button class="sound-btn" id="soundBtn" aria-label="Silenciar el sonido" hidden>
      <i class="fa-solid fa-volume-high"></i>
    </button>

    <!-- Escena nocturna -->
    <div class="escena" id="escena" aria-label="Una noche estrellada para Luz">
      <div class="cielo" id="cielo">
        <div id="estrellas"></div>

        <div class="nube nube-a" aria-hidden="true"></div>
        <div class="nube nube-b" aria-hidden="true"></div>
        <div class="nube nube-c" aria-hidden="true"></div>

        <button class="luna" id="luna" aria-label="La luna">
          <span class="luna-cuerpo">
            <svg class="luna-cara" viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="68" cy="28" r="6" fill="#e8c98f" opacity="0.55" />
              <circle cx="30" cy="68" r="4" fill="#e8c98f" opacity="0.5" />
              <circle cx="60" cy="74" r="2.6" fill="#e8c98f" opacity="0.5" />
              <path
                d="M28 44 q6 6 12 0"
                stroke="#b9873f"
                stroke-width="2.6"
                fill="none"
                stroke-linecap="round"
              />
              <path
                d="M58 44 q6 6 12 0"
                stroke="#b9873f"
                stroke-width="2.6"
                fill="none"
                stroke-linecap="round"
              />
              <path
                class="boca-neutra"
                d="M45 61 q4 2.6 8 0"
                stroke="#b9873f"
                stroke-width="2.4"
                fill="none"
                stroke-linecap="round"
              />
              <path
                class="boca-sonrisa"
                d="M40 58 q9 10 18 0"
                stroke="#b9873f"
                stroke-width="2.8"
                fill="none"
                stroke-linecap="round"
              />
              <circle class="mejilla" cx="27" cy="56" r="4.5" fill="#f4a9a0" opacity="0.55" />
              <circle class="mejilla" cx="72" cy="56" r="4.5" fill="#f4a9a0" opacity="0.55" />
            </svg>
            <span class="luna-sombra" id="lunaSombra" aria-hidden="true"></span>
          </span>
        </button>

        <div id="fugaces"></div>
      </div>

      <div class="suelo">
        <svg class="colinas" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
          <path
            fill="#161239"
            d="M0,200 C240,140 420,220 720,180 C980,150 1200,210 1440,170 L1440,320 L0,320 Z"
          />
          <path
            fill="#0d0a26"
            d="M0,250 C300,210 560,270 860,240 C1120,215 1300,260 1440,235 L1440,320 L0,320 Z"
          />
        </svg>

        <div class="arbol">
          <svg viewBox="0 0 200 260" aria-hidden="true">
            <path
              d="M92 260 L90 140 Q88 120 76 104 L84 100 Q96 116 100 140 L104 116 Q107 106 118 98 L124 104 Q113 115 110 138 L108 260 Z"
              fill="#241a10"
            />
            <ellipse cx="100" cy="80" rx="72" ry="56" fill="#16241d" />
            <ellipse cx="58" cy="112" rx="46" ry="36" fill="#1a2b22" />
            <ellipse cx="146" cy="106" rx="46" ry="38" fill="#131f19" />
            <ellipse cx="100" cy="62" rx="44" ry="32" fill="#1c2f25" />
          </svg>

          <button class="buho" id="buho" aria-label="Un pequeño búho escondido en el árbol">
            <svg viewBox="0 0 80 80" aria-hidden="true">
              <path d="M22 20 L30 6 L36 22 Z" fill="#33251a" />
              <path d="M44 22 L50 6 L58 20 Z" fill="#33251a" />
              <ellipse cx="40" cy="46" rx="24" ry="30" fill="#3a2b1e" />
              <ellipse cx="40" cy="57" rx="15" ry="17" fill="#57422c" />
              <path
                d="M32 52 q8 5 16 0 M32 60 q8 5 16 0"
                stroke="#3a2b1e"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
              />
              <g class="ojos">
                <circle cx="30" cy="36" r="9" fill="#f2e3bd" />
                <circle cx="50" cy="36" r="9" fill="#f2e3bd" />
                <circle cx="30" cy="36" r="4.2" fill="#17100a" />
                <circle cx="50" cy="36" r="4.2" fill="#17100a" />
                <circle cx="31.5" cy="34.5" r="1.3" fill="#ffffff" />
                <circle cx="51.5" cy="34.5" r="1.3" fill="#ffffff" />
              </g>
              <path d="M36 44 L44 44 L40 51 Z" fill="#f7b267" />
              <path
                d="M33 75 v4 M40 75 v4 M47 75 v4"
                stroke="#f7b267"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <span class="buho-huu" id="buhoHuu" aria-hidden="true">Huu…</span>
        </div>

        <div class="casita">
          <svg viewBox="0 0 260 220" aria-hidden="true">
            <rect x="182" y="52" width="20" height="52" fill="#241b3f" />
            <rect x="40" y="110" width="180" height="95" rx="4" fill="#2b2148" />
            <path d="M20 115 L130 28 L240 115 Z" fill="#1d1440" />
            <path
              d="M20 115 L130 28 L240 115"
              stroke="#3b2c63"
              stroke-width="4"
              fill="none"
              stroke-linecap="round"
            />
            <rect x="146" y="150" width="38" height="55" rx="4" fill="#191133" />
            <circle cx="153" cy="179" r="2.6" fill="#f7b267" />
            <rect x="30" y="203" width="200" height="6" rx="3" fill="#0d0a26" />
          </svg>

          <button class="ventana" id="ventana" aria-label="La ventana iluminada de la casita">
            <span class="ventana-luz" aria-hidden="true"></span>
            <span class="ventana-cruz" aria-hidden="true"></span>
            <span class="postigo izq" aria-hidden="true"></span>
            <span class="postigo der" aria-hidden="true"></span>
            <span class="taza" aria-hidden="true">
              <svg viewBox="0 0 60 50">
                <ellipse cx="28" cy="44" rx="20" ry="4" fill="#7c4a2a" />
                <path
                  d="M14 18 h28 v12 a14 10 0 0 1 -28 0 Z"
                  fill="#f5e7d0"
                />
                <ellipse cx="28" cy="19" rx="14" ry="4" fill="#6b4226" />
                <path
                  d="M43 22 q11 4 0 14"
                  stroke="#f5e7d0"
                  stroke-width="3.5"
                  fill="none"
                  stroke-linecap="round"
                />
              </svg>
              <span class="vapor v1"></span>
              <span class="vapor v2"></span>
              <span class="vapor v3"></span>
            </span>
          </button>
          <span class="mensaje-vapor" id="mensajeVapor"></span>
        </div>

        <div class="flores" id="flores"></div>
      </div>

      <div id="petalos" aria-hidden="true"></div>
      <div id="particulas" aria-hidden="true"></div>
      <div class="oscuridad" id="oscuridad" aria-hidden="true"></div>
    </div>

    <p class="mensaje-principal" id="mensajePrincipal" aria-live="polite"></p>
    <div class="cartel" id="cartel" role="status" aria-live="polite"></div>

    <!-- Secuencia final -->
    <section class="final" id="final" hidden>
      <p id="finalTexto"></p>
      <button class="btn-beso" id="btnBeso" hidden>
        Cerrar con un beso de buenas noches
      </button>
    </section>

    <!-- Despedida -->
    <section class="despedida" id="despedida" hidden>
      <span class="despedida-luna" id="despedidaLuna" aria-hidden="true"></span>
      <svg class="corazon" id="corazon" viewBox="0 0 32 30" aria-hidden="true">
        <path
          d="M16 29 C6 20 0 14 0 8 C0 3 4 0 8.5 0 C12 0 15 2.5 16 5 C17 2.5 20 0 23.5 0 C28 0 32 3 32 8 C32 14 26 20 16 29 Z"
          fill="#ffc8dd"
        />
      </svg>
      <p class="despedida-texto" id="despedidaTexto"></p>
      <button class="btn-fin" id="btnFin" hidden>
        <i class="fa-solid fa-heart" aria-hidden="true"></i>
        Fin de este pequeño viaje
      </button>
    </section>

    <!-- Portada -->
    <div class="intro" id="intro">
      <p class="intro-eyebrow">Página 3 de 3 · Antes de dormir</p>
      <h1>Buenas noches,<br />Luz</h1>
      <svg class="intro-ornamento" viewBox="0 0 220 24" aria-hidden="true">
        <path d="M10 12 H86" stroke="currentColor" stroke-width="1" />
        <path d="M134 12 H210" stroke="currentColor" stroke-width="1" />
        <g fill="currentColor">
          <path d="M110 2 L112.4 9.2 L120 12 L112.4 14.8 L110 22 L107.6 14.8 L100 12 L107.6 9.2 Z" />
        </g>
        <circle cx="110" cy="12" r="1.8" fill="#ffd6a5" />
      </svg>
      <p class="intro-sub">El cielo ya está listo para ti. Entra despacio…</p>
      <button class="intro-btn" id="enterBtn">Entrar de puntillas</button>
    </div>

    <div class="container" style="display: none">
      <div id="status" class="status disconnected">Conectando...</div>
      <div id="error" class="error" style="display: none"></div>

      <label>Tu IP: <strong id="miIP">Detectando...</strong></label>
      <label>Fecha y Hora: <strong id="fechaHora">-</strong></label>
      <label
        >Navegador:
        <strong id="miNavegador" style="color: #667eea">-</strong></label
      >
    </div>

    <script src="assets/js/transicion.js"></script>
    <script src="assets/js/buenas-noches.js"></script>

    <script>
      function goBack() {
        window.location.href = "index.html";
      }
    </script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script src="assets/js/firebase-config.js"></script>

    <script>
      (function () {
        detectarIP();
        actualizarFechaHora();

        setTimeout(() => {
          agregarDatos("BuenasNoches");
        }, 1000);
      })();
    </script>
  </body>
</html>
